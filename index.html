<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI 앞에서, 나는 어떤 선택을 할까?</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F1ECFF; --card:#FFFFFF; --ink:#1B1B3A; --ol:#1B1B3A; --sh:#1B1B3A; --sub:#56567C;
  --yellow:#FFD23F; --pink:#FF6FA5; --mint:#3DDBBE; --violet:#9B86FF; --onpop:#1B1B3A;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#15152E; --card:#25254D; --ink:#F6F4FF; --ol:#F6F4FF; --sh:#05050F; --sub:#B4B4DA;}
}
:root[data-theme="dark"]{--bg:#15152E; --card:#25254D; --ink:#F6F4FF; --ol:#F6F4FF; --sh:#05050F; --sub:#B4B4DA;}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",system-ui,sans-serif;line-height:1.6;min-height:100vh}
.wrap{max-width:480px;margin:0 auto;padding:16px 16px 44px}
.jua,h1,h2,.q{font-family:"Jua","Noto Sans KR",sans-serif;font-weight:400}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:4px solid var(--violet);outline-offset:3px}
.screen[hidden]{display:none}
.flip{animation:flip .38s ease-out}
@keyframes flip{from{opacity:0;transform:perspective(700px) rotateY(-80deg)}to{opacity:1;transform:none}}

/* start */
.hero{text-align:center;padding-top:18px}
.hero h1{font-size:clamp(34px,10vw,46px);line-height:1.25;margin:6px 0 10px}
.hl{background:var(--yellow);color:var(--onpop);padding:0 8px;border-radius:12px;border:3px solid var(--ol);display:inline-block;transform:rotate(-2deg)}
.hero p{color:var(--sub);margin:0 auto;max-width:24em}
.fan{display:flex;justify-content:center;margin:26px 0 30px}
.fan .c{width:72px;height:104px;border:4px solid var(--ol);border-radius:16px;display:grid;place-items:center;font-size:34px;box-shadow:4px 4px 0 var(--sh);margin-left:-12px;color:var(--onpop)}
.fan .c:nth-child(1){background:var(--mint);transform:rotate(-12deg);margin-left:0}
.fan .c:nth-child(2){background:var(--pink);transform:rotate(-4deg) translateY(-6px)}
.fan .c:nth-child(3){background:var(--violet);transform:rotate(4deg) translateY(-6px)}
.fan .c:nth-child(4){background:var(--yellow);transform:rotate(12deg)}
.btn{width:100%;border:4px solid var(--ol);border-radius:22px;background:var(--pink);color:var(--onpop);font-family:"Jua",sans-serif;font-size:23px;padding:13px 20px;box-shadow:5px 5px 0 var(--sh);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translate(4px,4px);box-shadow:1px 1px 0 var(--sh)}
.meta{color:var(--sub);font-size:13px;margin-top:16px;text-align:center}

/* quiz */
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-family:"Jua",sans-serif;font-size:17px}
.top span{background:var(--ol);color:var(--bg);border-radius:99px;padding:1px 12px;font-size:15px}
.segs{display:flex;gap:4px;margin-bottom:18px}
.segs i{flex:1;height:12px;border:2.5px solid var(--ol);border-radius:99px;background:var(--card)}
.segs i.done{background:var(--mint)} .segs i.now{background:var(--yellow)}
.sit{background:var(--card);border:4px solid var(--ol);border-radius:28px;box-shadow:7px 7px 0 var(--sh);padding:16px 18px 20px;margin:0 6px 22px 0}
.sit-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
.tab{font-family:"Jua",sans-serif;background:var(--ol);color:var(--bg);border-radius:10px;padding:1px 10px;font-size:14px;letter-spacing:.5px}
.topic{font-weight:700;font-size:13px;background:var(--yellow);color:var(--onpop);border:3px solid var(--ol);border-radius:99px;padding:1px 12px}
.q{font-size:21px;line-height:1.5}
.opts{display:flex;flex-direction:column;gap:12px;padding:0;margin:0 6px 0 0;list-style:none}
.opt{width:100%;display:flex;gap:12px;align-items:flex-start;text-align:left;background:var(--card);border:3.5px solid var(--ol);border-radius:20px;box-shadow:4px 4px 0 var(--sh);padding:12px 14px;font-size:15.5px;font-weight:500;transition:transform .08s,box-shadow .08s,background .12s}
.opt:active,.opt.picked{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--sh)}
.opt.picked{background:var(--yellow);color:var(--onpop)}
.chip{flex:none;width:30px;height:30px;border:3px solid var(--ol);border-radius:50%;display:grid;place-items:center;font-family:"Jua",sans-serif;font-size:16px;color:var(--onpop)}
li:nth-child(1) .chip{background:var(--pink)} li:nth-child(2) .chip{background:var(--yellow)}
li:nth-child(3) .chip{background:var(--mint)} li:nth-child(4) .chip{background:var(--violet)}
.back{background:none;border:0;color:var(--sub);padding:16px 2px 0;font-size:14px}

/* result */
.tcard{border:4px solid var(--ol);border-radius:30px;background:var(--card);box-shadow:8px 8px 0 var(--sh);overflow:hidden;margin:0 8px 0 0}
.t-top{display:flex;justify-content:space-between;align-items:center;padding:8px 18px;border-bottom:4px solid var(--ol);font-family:"Jua",sans-serif;font-size:16px;color:var(--onpop)}
.art{height:160px;display:grid;place-items:center;font-size:92px;border-bottom:4px solid var(--ol);background-image:radial-gradient(rgba(27,27,58,.2) 2.5px,transparent 2.5px);background-size:16px 16px}
.t-name{font-family:"Jua",sans-serif;font-size:34px;text-align:center;margin:12px 0 2px}
.t-sub{text-align:center;color:var(--sub);font-size:13px;font-weight:700}
.t-body{padding:6px 20px 18px}
.t-body p{margin:10px 0}
.stat{display:grid;grid-template-columns:132px 1fr 22px;gap:8px;align-items:center;font-size:13.5px;margin:6px 0}
.stat span.t{height:14px;border:2.5px solid var(--ol);border-radius:99px;background:var(--bg);overflow:hidden}
.stat span.t i{display:block;height:100%;border-right:2.5px solid var(--ol)}
.stat span.t i[style*="width:0%"]{border-right:0}
.h3{font-family:"Jua",sans-serif;font-size:15px;margin:14px 0 2px;display:block}
.box{border:3.5px solid var(--ol);border-radius:22px;box-shadow:5px 5px 0 var(--sh);padding:14px 16px;margin:20px 8px 0 0;background:var(--card)}
.box .lab{font-family:"Jua",sans-serif;font-size:17px;display:block;margin-bottom:4px}
.box.q2{background:var(--yellow);color:var(--onpop)}
.box.q2 .lab,.box.q2 span{color:var(--onpop)}
.pair .rowp{display:flex;gap:12px;align-items:flex-start}
.pair .em{flex:none;width:52px;height:52px;border:3.5px solid var(--ol);border-radius:16px;display:grid;place-items:center;font-size:28px;color:var(--onpop)}
.pair .tg{display:inline-block;font-family:"Jua",sans-serif;font-size:14px;border:3px solid var(--ol);border-radius:99px;padding:0 12px;margin-bottom:4px;color:var(--onpop)}
.pair.good .tg{background:var(--mint)} .pair.clash .tg{background:var(--pink)}
.pair b.who{display:block;font-family:"Jua",sans-serif;font-weight:400;font-size:20px}
.pair .how{display:block;margin-top:6px;font-weight:700}
.note{font-size:13px;color:var(--sub);margin:20px 4px 0;text-align:center}
.again{margin-top:16px;background:var(--mint)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<main class="wrap">

<section id="start" class="screen">
  <div class="hero flip">
    <h1>AI 앞에서,<br><span class="hl">나의 선택</span>은?</h1>
    <p>15장의 딜레마 카드를 넘기며 내 생각을 골라 보세요. 마지막에 나만의 캐릭터 카드를 받아요. 정답은 없어요!</p>
    <div class="fan" aria-hidden="true"><div class="c">⚖️</div><div class="c">⚡</div><div class="c">🔍</div><div class="c">🛡️</div></div>
    <button class="btn" id="startBtn">카드 뽑으러 가기</button>
    <div class="meta">약 5분 · 15장 · 이름이나 답은 어디에도 저장되지 않아요</div>
  </div>
</section>

<section id="quiz" class="screen" hidden>
  <div class="top">딜레마 카드 <span id="count"></span></div>
  <div class="segs" id="segs" role="progressbar" aria-valuemin="0" aria-valuemax="15"></div>
  <div id="stage" aria-live="polite"></div>
  <ul class="opts" id="opts"></ul>
  <button class="back" id="backBtn">← 이전 카드</button>
</section>

<section id="result" class="screen" hidden></section>

</main>

<script>

function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;} return a; }
QS.forEach(function(q){ q.o = shuffle(q.o); });


var TOPICS = ["🧾 정직 · 정확한 정보","🤝 우정 vs 정직","⚖️ 공정 · 규칙","👁️ 안전 vs 사생활","📰 진실 · 책임 있는 공유","🪞 존중 · 초상권","©️ 저작권","🚗 책임 · 생명","🤖 관계 · 정서","🎨 창작 · 저작권","📊 공정 · 접근성","🧮 차별 · 편향","🔐 개인정보","💼 사회적 책임","🧠 사고력 · 학습"];
var LET = ["A","B","C","D"];
function el(tag, cls, text, parent){
  var e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text) e.textContent = text;
  if (parent) parent.appendChild(e);
  return e;
}
var $ = function(id){return document.getElementById(id)};
var idx = 0, answers = [], locked = false;

function show(id){
  ["start","quiz","result"].forEach(function(s){ $(s).hidden = (s !== id); });
  window.scrollTo(0,0);
}
function segs(){
  var s = $("segs"); s.innerHTML = "";
  for (var i = 0; i < QS.length; i++){
    var d = el("i", i < idx ? "done" : (i === idx ? "now" : ""), "", s);
  }
  s.setAttribute("aria-valuenow", idx);
}
function render(){
  locked = false;
  var q = QS[idx];
  $("count").textContent = (idx+1) + " / " + QS.length;
  segs();
  $("backBtn").style.visibility = idx === 0 ? "hidden" : "visible";
  var stage = $("stage"); stage.innerHTML = "";
  var card = el("div","sit flip","",stage);
  var head = el("div","sit-head","",card);
  el("span","tab","SITUATION " + (idx+1 < 10 ? "0" : "") + (idx+1),head);
  el("span","topic",TOPICS[idx],head);
  el("div","q",q.q,card);
  var ul = $("opts"); ul.innerHTML = "";
  q.o.forEach(function(pair, n){
    var li = el("li","","",ul);
    var b = el("button","opt" + (answers[idx] === pair[0] ? " picked" : ""),"",li);
    el("span","chip",LET[n],b);
    el("span","",pair[1],b);
    b.onclick = function(){
      if (locked) return;
      locked = true;
      answers[idx] = pair[0];
      Array.prototype.forEach.call(ul.querySelectorAll(".opt"), function(x){ x.classList.remove("picked"); });
      b.classList.add("picked");
      setTimeout(next, 420);
    };
  });
}
function next(){
  if (idx < QS.length - 1){ idx++; render(); window.scrollTo(0,0); } else { finish(); }
}
function finish(){
  var score = {nav:0,magic:0,explore:0,sprout:0};
  answers.forEach(function(a){ if (a) score[a]++; });
  var mx = Math.max(score.nav,score.magic,score.explore,score.sprout);
  var tied = ORDER.filter(function(k){ return score[k] === mx; });
  var best = tied[0];
  for (var i = answers.length - 1; i >= 0; i--){ if (tied.indexOf(answers[i]) > -1){ best = answers[i]; break; } }
  var t = TYPES[best], c = $("result");
  c.innerHTML = "";
  var card = el("div","tcard flip","",c);
  var top = el("div","t-top","",card); top.style.background = t.color;
  el("span","","MY AI CARD",top); el("span","","No." + (ORDER.indexOf(best)+1),top);
  var art = el("div","art",t.emoji,card); art.style.backgroundColor = t.color; art.setAttribute("aria-hidden","true");
  el("div","t-name",t.name,card);
  el("div","t-sub","나의 AI 선택 유형",card);
  var body = el("div","t-body","",card);
  el("p","",t.desc,body);
  el("span","h3","선택 능력치",body);
  ORDER.forEach(function(k){
    var row = el("div","stat","",body);
    el("span","",TYPES[k].emoji + " " + TYPES[k].name,row);
    var tr = el("span","t","",row);
    var fi = el("i","","",tr); fi.style.width = (score[k] / QS.length * 100) + "%"; fi.style.background = TYPES[k].color;
    el("span","",String(score[k]),row);
  });
  var qb = el("div","box q2","",c);
  el("span","lab","💬 함께 생각해 볼 질문",qb); el("span","",t.ask,qb);
  var tb = el("div","box","",c);
  el("span","lab","💡 성장 퀘스트",tb); el("span","",t.tip,tb);
  function pair(kind, label, m){
    var d = el("div","box pair " + kind,"",c);
    var r = el("div","rowp","",d);
    var em = el("div","em",TYPES[m.k].emoji,r); em.style.background = TYPES[m.k].color;
    var b = el("div","","",r);
    el("span","tg",label,b);
    el("b","who",TYPES[m.k].name,b);
    el("span","",m.why,b);
    el("span","how","함께할 때: " + m.how,b);
  }
  pair("good","👍 짝 카드 · 서로 도움이 되는 유형", MATCH[best].good);
  pair("clash","⚡ 주의 카드 · 부딪히기 쉬운 유형", MATCH[best].clash);
  el("p","note","어떤 카드가 더 좋거나 나쁜 것은 아니에요. 왜 그렇게 골랐는지 이유를 이야기해 보는 게 중요해요. 📸 내 카드를 캡처해 두세요!",c);
  var again = el("button","btn again","다시 뽑기",c);
  again.onclick = function(){ idx = 0; answers = []; show("start"); };
  show("result");
}
$("startBtn").onclick = function(){ idx = 0; answers = []; show("quiz"); render(); };
$("backBtn").onclick = function(){ if (idx > 0){ idx--; render(); } };
</script>
